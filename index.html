
<style>
* { margin:0; padding:0; box-sizing:border-box; }
#wrap {
  width:100%; min-height:600px;
  background:#0a0005;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:24px 0 32px;
  position:relative;
  overflow:hidden;
}
#bear {
  font-size:3.8rem; line-height:1;
  margin-bottom:8px;
  animation: wobble 2.5s ease-in-out infinite;
  display:block; z-index:2;
}
@keyframes wobble {
  0%,100%{transform:rotate(-4deg) scale(1);}
  50%{transform:rotate(4deg) scale(1.08);}
}
canvas { display:block; z-index:1; }
#msg {
  font-family:'Playfair Display',serif;
  font-size:1.1rem;
  font-weight:700;
  color:#ffb3c6;
  text-align:center;
  max-width:340px;
  line-height:1.9;
  opacity:0;
  transition: opacity 1.8s ease;
  padding:0 20px;
  letter-spacing:0.03em;
  z-index:2;
  text-shadow: 0 0 18px rgba(255,100,150,0.6);
  margin-top:4px;
}
#msg.show { opacity:1; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">

<div id="wrap">
  <span id="bear">🐻</span>
  <canvas id="cvs" width="380" height="360"></canvas>
  <div id="msg">Anh xin lỗi em nha,<br>anh xin lỗi vì làm em không được yên đi chơi,<br>em bớt dỗi lại nghen 🩷</div>
</div>

<script>
const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');
const W = 380, H = 360;
const CX = W/2, CY = H/2 + 10;

function heartXY(t, scale) {
  const x = scale * 16 * Math.pow(Math.sin(t), 3) / 16;
  const y = -scale * (13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)) / 16;
  return { x: CX + x, y: CY + y };
}

const N = 1800;
const targets = [];
for (let i = 0; i < N; i++) {
  const t = (i / N) * Math.PI * 2;
  const jitter = (Math.random() - 0.5) * 9;
  const p = heartXY(t, 120 + (Math.random()-0.5)*14);
  targets.push({ x: p.x + jitter, y: p.y + (Math.random()-0.5)*9 });
}

const hues = [330,340,350,320,355,315,345];
function randColor() {
  const h = hues[Math.floor(Math.random()*hues.length)];
  const s = 70 + Math.random()*25;
  const l = 55 + Math.random()*25;
  return `hsl(${h},${s}%,${l}%)`;
}

const particles = [];
let spawnIdx = 0;
let spawnBatch = 2;
let frame = 0;
let allDone = false;
let beatScale = 1;
let beatDir = 1;
let msgShown = false;

function spawnNext() {
  if (spawnIdx >= N) return;
  const count = Math.min(spawnBatch, N - spawnIdx);
  for (let i = 0; i < count; i++) {
    const tgt = targets[spawnIdx + i];
    const angle = Math.random() * Math.PI * 2;
    const dist = 220 + Math.random() * 120;
    particles.push({
      x: CX + Math.cos(angle)*dist,
      y: CY + Math.sin(angle)*dist,
      tx: tgt.x, ty: tgt.y,
      r: 0.3 + Math.random()*1.2,
      alpha: 0,
      color: randColor(),
      speed: 0.055 + Math.random()*0.04,
      arrived: false,
      twinkleOff: Math.random()*Math.PI*2,
      twinkleSpd: 0.04 + Math.random()*0.04,
    });
  }
  spawnIdx += count;
}

let glowPulse = 0;

function loop() {
  frame++;
  ctx.clearRect(0, 0, W, H);

  if (!allDone) {
    if (frame % Math.max(1, Math.floor(8 - spawnIdx/220)) === 0) {
      spawnBatch = Math.min(Math.ceil(spawnBatch * 1.06), 60);
      spawnNext();
    }
  }

  let arrivedN = 0;
  const bs = allDone ? beatScale : 1;

  ctx.save();
  ctx.translate(CX, CY);
  ctx.scale(bs, bs);
  ctx.translate(-CX, -CY);

  for (const p of particles) {
    if (!p.arrived) {
      const dx = p.tx - p.x, dy = p.ty - p.y;
      const d = Math.sqrt(dx*dx+dy*dy);
      p.x += dx * p.speed;
      p.y += dy * p.speed;
      p.alpha = Math.min(p.alpha + 0.04, 1);
      p.r = Math.min(p.r + 0.04, p.r + 0.8);
      if (d < 1.5) { p.arrived = true; p.x = p.tx; p.y = p.ty; }
    } else {
      arrivedN++;
      p.alpha = 0.7 + 0.3 * Math.sin(frame * p.twinkleSpd + p.twinkleOff);
    }

    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(0.4, p.r), 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.alpha;
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  if (arrivedN >= N - 10 && !allDone) {
    allDone = true;
    setTimeout(() => {
      document.getElementById('msg').classList.add('show');
    }, 900);
  }

  if (allDone) {
    beatScale += beatDir * 0.003;
    if (beatScale > 1.055) beatDir = -1;
    if (beatScale < 0.975) beatDir = 1;

    glowPulse = (beatScale - 0.975) / 0.08;
    const glow = Math.floor(glowPulse * 40);
    ctx.save();
    ctx.globalAlpha = 0.08 + glowPulse * 0.1;
    ctx.translate(CX, CY);
    ctx.scale(beatScale * 1.06, beatScale * 1.06);
    ctx.translate(-CX, -CY);
    for (const p of particles) {
      if (!p.arrived) continue;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r + 2, 0, Math.PI*2);
      ctx.fillStyle = p.color;
      ctx.fill();
    }
    ctx.restore();
  }

  requestAnimationFrame(loop);
}

loop();
</script>
